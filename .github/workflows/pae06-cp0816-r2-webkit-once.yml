name: PAE-06 CP08.16-R2 one-shot real WebKit IndexedDB concurrency

on:
  push:
    branches:
      - pilot/pae06-qa-hub-v1-20261121
    paths:
      - .github/workflows/pae06-cp0816-r2-webkit-once.yml

permissions:
  contents: read

concurrency:
  group: pae06-cp0816-r2-webkit-once
  cancel-in-progress: false

jobs:
  webkit-r2-once:
    if: github.event.before == '967936c20bb1272f8df0dfb1c7ad163bb90ddd11' && github.event.created == false && github.event.deleted == false && github.event.forced == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NPM_CONFIG_FETCH_RETRIES: '0'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact branch commit without global Git safe.directory
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          set-safe-directory: false
          fetch-depth: 3

      - name: Set exact Node 22.16.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'

      - name: STOP FIRST verify two add-only commits and source pins
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/pilot/pae06-qa-hub-v1-20261121'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '967936c20bb1272f8df0dfb1c7ad163bb90ddd11'
          test "$(git rev-parse HEAD^^)" = '5566dd03f91eb3d148326b28f992ab9442af7ccc'
          test "$(git diff --name-status HEAD^ HEAD)" = "$(printf 'A\t.github/workflows/pae06-cp0816-r2-webkit-once.yml')"
          test "$(git diff --name-status HEAD^^ HEAD)" = "$(printf 'A\t.github/workflows/pae06-cp0816-r2-webkit-once.yml\nA\tqa-hub/r2-tx01-webkit.mjs')"
          test -z "$(git status --porcelain)"
          test "$(node --version)" = 'v22.16.0'
          node --check qa-hub/r2-tx01-webkit.mjs
          node -e "const p=require('./qa-hub/package.json');const l=require('./qa-hub/package-lock.json');if(p.dependencies.playwright!=='1.65.1'||l.packages['node_modules/playwright-core'].version!=='1.65.1')process.exit(1)"
          test "$(git rev-parse HEAD:qa-hub/r2-tx01-webkit.mjs)" = 'd86c898e9e2a5eb243dcab979ff7952666fa8a2c'
          test "$(git rev-parse HEAD:qa-hub/qa-hub.mjs)" = '3324dcaea29332c83e329346be66cf16db85b0d1'
          test "$(git rev-parse HEAD:qa-hub/package-lock.json)" = '0feda295284b5e56637aa036821bd24dd074f5ab'
          test "$(git rev-parse HEAD:src/restore.mjs)" = '2cdbc7223f96978d4cc823ad6ef434ccb8b76ce6'
          test "$(git rev-parse HEAD:src/test-idb-gate.mjs)" = '7522a67cde97446b220cd06ccaa7c6fc420faf60'
          test "$(git rev-parse HEAD:restore-test.mjs)" = 'cf7adb356fadbaa10d11fc44257e50c80de69a2f'
          test "$(git rev-parse HEAD:tests/fixtures/synthetic_export.json)" = 'ff433fe734cc0ae364f0346f4b1a322d3a46d45'
          test "$(git rev-parse HEAD:.github/workflows/pae06-qa-hub-once.yml)" = 'c33365a9c5f1daa946567ad1ae928b19345bc8c0'

      - name: Install only pinned Playwright Node dependency on ephemeral host
        working-directory: qa-hub
        run: npm ci --ignore-scripts --no-audit --no-fund --no-progress

      - name: Exactly one offline-network Docker WebKit R2-TX-01
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -d "$GITHUB_WORKSPACE/qa-hub/node_modules/playwright"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/pae06-r2-output"
          chmod 700 "$RUNNER_TEMP/pae06-r2-output"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=384 \
            --memory=3g \
            --cpus=2 \
            --shm-size=768m \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env CI=true \
            --env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            --tmpfs /tmp:rw,nosuid,size=512m,mode=1777 \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --volume "$RUNNER_TEMP/pae06-r2-output:/repo/qa-hub/.run:rw" \
            --workdir /repo/qa-hub \
            mcr.microsoft.com/playwright:v1.65.1-noble \
            node r2-tx01-webkit.mjs
