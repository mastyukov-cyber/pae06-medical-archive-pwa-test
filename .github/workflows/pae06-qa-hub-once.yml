name: PAE-06 QA HUB one-shot synthetic Chromium then WebKit

on:
  push:
    branches:
      - pilot/pae06-qa-hub-v1-20261121
    paths:
      - .github/workflows/pae06-qa-hub-once.yml

permissions:
  contents: read

concurrency:
  group: pae06-qa-hub-one-shot
  cancel-in-progress: false

jobs:
  qa-once:
    if: github.event.before == '1f0060c8f36125b606e8d7b0fe4549d7a538bb71' && github.event.created == false && github.event.deleted == false && github.event.forced == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NPM_CONFIG_FETCH_RETRIES: '0'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact branch commit on host without Git global safe.directory
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          set-safe-directory: false
          fetch-depth: 2
      - name: Set exact Node 22.16.0 on host
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: STOP FIRST verify immutable parent, one file, source and syntax
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/pilot/pae06-qa-hub-v1-20261121'
          test "$PWD" = "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = '1f0060c8f36125b606e8d7b0fe4549d7a538bb71'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          expected="$(printf 'A\t.github/workflows/pae06-qa-hub-once.yml')"
          actual="$(git diff --name-status HEAD^ HEAD)"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"
          test "$(node --version)" = 'v22.16.0'
          node --check qa-hub/qa-hub.mjs
          node -e "const p=require('./qa-hub/package.json'); const l=require('./qa-hub/package-lock.json'); if(p.name!=='pae06-qa-hub-synthetic-pilot'||p.dependencies.playwright!=='1.65.1'||l.packages['node_modules/playwright-core'].version!=='1.65.1'||l.packages[''].dependencies.playwright!=='1.65.1') process.exit(1)"
          test "$(git rev-parse HEAD:qa-hub/qa-hub.mjs)" = '3324dcaea29332c83e329346be66cf16db85b0d1'
          test "$(git rev-parse HEAD:qa-hub/package-lock.json)" = '0feda295284b5e56637aa036821bd24dd074f5ab'
          test "$(git rev-parse HEAD:src/test-idb-gate.mjs)" = '7522a67cde97446b220cd06ccaa7c6fc420faf60'
          test "$(git rev-parse HEAD:app.js)" = '6065e80353734648d211b31582ec1462d264e046'
          test "$(git rev-parse HEAD:sw.js)" = 'e6bdb9ed12eb5da3037cd9ef7f083d09a69b9c51'
      - name: Install only pinned Playwright Node dependencies on ephemeral HOST
        working-directory: qa-hub
        run: npm ci --ignore-scripts --no-audit --no-fund --no-progress
      - name: Verify SHA-pinned synthetic-only sources on HOST
        working-directory: qa-hub
        run: npm run verify
      - name: Exactly one offline-network Docker Chromium then WebKit synthetic QA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -d "$GITHUB_WORKSPACE/qa-hub/node_modules/playwright"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/pae06-qa-output"
          chmod 700 "$RUNNER_TEMP/pae06-qa-output"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit=384 \
            --memory=3g \
            --cpus=2 \
            --shm-size=768m \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env CI=true \
            --env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            --tmpfs /tmp:rw,nosuid,size=512m,mode=1777 \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --volume "$RUNNER_TEMP/pae06-qa-output:/repo/qa-hub/.run:rw" \
            --workdir /repo/qa-hub \
            mcr.microsoft.com/playwright:v1.65.1-noble \
            node qa-hub.mjs qa
